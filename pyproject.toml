readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium[box2d]>=1.2.3",
    "swig>=4.4.1",
    "stable-baselines3>=2.7.1",
    "openai>=2.21.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "jupyter>=1.1.1",
]
